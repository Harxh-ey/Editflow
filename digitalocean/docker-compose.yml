version: '3.8'

services:
  # DigitalOcean GPU Droplet / Container Service for Gemma 2
  gemma-inference:
    image: ollama/ollama:latest
    container_name: editflow-gemma-inference
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    # For DigitalOcean GPU Droplets with NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional NGINX reverse proxy for HTTPS + Bearer token auth
  proxy:
    image: nginx:alpine
    container_name: editflow-gemma-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gemma-inference

volumes:
  ollama_data:
